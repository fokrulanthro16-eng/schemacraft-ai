<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Card Fill Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.15"/>
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)" rx="16"/>
  <rect width="1198" height="678" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="1.5" rx="15"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.04" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="120" y1="0" x2="120" y2="680"/>
    <line x1="240" y1="0" x2="240" y2="680"/>
    <line x1="360" y1="0" x2="360" y2="680"/>
    <line x1="480" y1="0" x2="480" y2="680"/>
    <line x1="600" y1="0" x2="600" y2="680"/>
    <line x1="720" y1="0" x2="720" y2="680"/>
    <line x1="840" y1="0" x2="840" y2="680"/>
    <line x1="960" y1="0" x2="960" y2="680"/>
    <line x1="1080" y1="0" x2="1080" y2="680"/>
  </g>

  <!-- Title & Header Banner -->
  <g transform="translate(60, 45)">
    <rect width="36" height="36" rx="8" fill="#06b6d4" opacity="0.2"/>
    <path d="M10 18 L18 10 L26 18 L18 26 Z" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="18" cy="18" r="3" fill="#22d3ee"/>
    <text x="48" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">SchemaCraft AI</text>
    <text x="238" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">| System Architecture &amp; Data Pipeline</text>

    <!-- Top Badge -->
    <rect x="940" y="4" width="140" height="28" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
    <text x="1010" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">ZERO-BACKEND 3NF</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. LAYER: CLIENT INPUT LAYER (Left) -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 110)">
    <rect width="240" height="510" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect width="240" height="4" rx="2" fill="url(#accentCyan)"/>
    
    <text x="20" y="32" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">LAYER 01</text>
    <text x="20" y="54" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="17" font-weight="700">Client Input Layer</text>
    <text x="20" y="74" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Natural Language Prompts</text>

    <!-- Input Box Card -->
    <rect x="16" y="95" width="208" height="110" rx="8" fill="#030712" stroke="#334155" stroke-width="1"/>
    <text x="26" y="118" fill="#94a3b8" font-family="monospace" font-size="11">&gt; "Hospital triage with</text>
    <text x="26" y="136" fill="#94a3b8" font-family="monospace" font-size="11">   patients, doctors, ESI</text>
    <text x="26" y="154" fill="#94a3b8" font-family="monospace" font-size="11">   vitals, &amp; bed alerts..."</text>
    <rect x="26" y="172" width="70" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
    <text x="61" y="186" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Execute</text>

    <!-- Domain Archetype Badges -->
    <text x="20" y="235" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Preset Domain Archetypes:</text>
    
    <!-- Preset 1 -->
    <rect x="16" y="250" width="208" height="48" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="28" y="272" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Healthcare Triage</text>
    <text x="28" y="288" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Clinical 3NF • ESI 1-5 Scoring</text>

    <!-- Preset 2 -->
    <rect x="16" y="306" width="208" height="48" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="28" y="328" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">B2B SaaS Platform</text>
    <text x="28" y="344" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">RBAC • Tenants • Subscriptions</text>

    <!-- Preset 3 -->
    <rect x="16" y="362" width="208" height="48" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="28" y="384" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">E-Commerce Market</text>
    <text x="28" y="400" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Warehouses • Orders • Logistics</text>

    <!-- Preset 4 -->
    <rect x="16" y="418" width="208" height="48" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="28" y="440" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Ride-Sharing Fleet</text>
    <text x="28" y="456" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">EV Drivers • Trips • Telemetry</text>

    <!-- Offline badge -->
    <rect x="16" y="476" width="208" height="24" rx="4" fill="#14532d" opacity="0.3"/>
    <text x="120" y="492" fill="#4ade80" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">✓ 100% CLIENT-SIDE OFFLINE</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 300 365 L 340 365" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="340,361 348,365 340,369" fill="#06b6d4"/>

  <!-- ========================================================================= -->
  <!-- 2. LAYER: SYNTHESIS & 3NF NORMALIZER ENGINE (Center-Left) -->
  <!-- ========================================================================= -->
  <g transform="translate(350, 110)">
    <rect width="250" height="510" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect width="250" height="4" rx="2" fill="url(#accentPurple)"/>

    <text x="20" y="32" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">LAYER 02</text>
    <text x="20" y="54" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="17" font-weight="700">AST Normalizer Engine</text>
    <text x="20" y="74" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Deterministic Graph Compiler</text>

    <!-- Stage 1 Box -->
    <rect x="16" y="95" width="218" height="75" rx="6" fill="#090d16" stroke="#2e1065"/>
    <text x="26" y="118" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">1. Semantic Tokenizer</text>
    <text x="26" y="136" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Domain keyword matching</text>
    <text x="26" y="152" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Boundary &amp; Entity extractor</text>

    <!-- Connector line -->
    <line x1="125" y1="170" x2="125" y2="185" stroke="#a855f7" stroke-width="2"/>

    <!-- Stage 2 Box -->
    <rect x="16" y="185" width="218" height="95" rx="6" fill="#090d16" stroke="#2e1065"/>
    <text x="26" y="208" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">2. 3NF Relational Resolver</text>
    <text x="26" y="226" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• 1NF: Atomic scalar columns</text>
    <text x="26" y="242" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• 2NF: Full PK functional dependency</text>
    <text x="26" y="258" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• 3NF: Decouple transitive relations</text>

    <!-- Connector line -->
    <line x1="125" y1="280" x2="125" y2="295" stroke="#a855f7" stroke-width="2"/>

    <!-- Stage 3 Box -->
    <rect x="16" y="295" width="218" height="85" rx="6" fill="#090d16" stroke="#2e1065"/>
    <text x="26" y="318" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">3. DAG Topological Sorter</text>
    <text x="26" y="336" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Directed Acyclic Graph ordering</text>
    <text x="26" y="352" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Prevent cyclic FK deadlock</text>
    <text x="26" y="368" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Parent-first table creation</text>

    <!-- Stage 4 Box: Seed Generator -->
    <rect x="16" y="390" width="218" height="75" rx="6" fill="#090d16" stroke="#2e1065"/>
    <text x="26" y="413" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">4. Synthetic Seed Engine</text>
    <text x="26" y="431" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Real-world contextual records</text>
    <text x="26" y="447" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• Guaranteed referential FK UUIDs</text>

    <!-- Latency pill -->
    <rect x="16" y="476" width="218" height="24" rx="4" fill="#3b0764" opacity="0.4"/>
    <text x="125" y="492" fill="#d8b4fe" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">SPEED: &lt; 15MS EXECUTION</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <path d="M 600 240 L 640 240" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="640,236 648,240 640,244" fill="#a855f7"/>

  <path d="M 600 480 L 640 480" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="640,476 648,480 640,484" fill="#10b981"/>

  <!-- ========================================================================= -->
  <!-- 3. LAYER: MULTI-TARGET COMPILERS (Center-Right Top) -->
  <!-- ========================================================================= -->
  <g transform="translate(650, 110)">
    <rect width="260" height="240" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect width="260" height="4" rx="2" fill="url(#accentAmber)"/>

    <text x="20" y="30" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">LAYER 03</text>
    <text x="20" y="50" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Multi-Target Compilers</text>

    <!-- Target 1: Postgres -->
    <rect x="16" y="65" width="228" height="46" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="28" y="85" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">PostgreSQL DDL (init.sql)</text>
    <text x="28" y="101" fill="#64748b" font-family="monospace" font-size="10">UUID-OSSP, ON DELETE CASCADE, Indexes</text>

    <!-- Target 2: Prisma -->
    <rect x="16" y="118" width="228" height="46" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="28" y="138" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Prisma Schema (schema.prisma)</text>
    <text x="28" y="154" fill="#64748b" font-family="monospace" font-size="10">@relation, @@map, reciprocal arrays</text>

    <!-- Target 3: TypeScript -->
    <rect x="16" y="171" width="228" height="46" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="28" y="191" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">TypeScript (types.ts)</text>
    <text x="28" y="207" fill="#64748b" font-family="monospace" font-size="10">Strict Interfaces &amp; Create/Update DTOs</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. LAYER: IN-MEMORY REST SANDBOX (Center-Right Bottom) -->
  <!-- ========================================================================= -->
  <g transform="translate(650, 380)">
    <rect width="260" height="240" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect width="260" height="4" rx="2" fill="url(#accentEmerald)"/>

    <text x="20" y="30" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">LAYER 04</text>
    <text x="20" y="50" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">In-Memory Mock REST Sandbox</text>

    <!-- Console Terminal Mockup -->
    <rect x="16" y="65" width="228" height="155" rx="6" fill="#030712" stroke="#064e3b" stroke-width="1"/>
    
    <!-- Endpoint line -->
    <text x="26" y="88" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">GET /api/v1/:entity</text>
    <text x="26" y="106" fill="#64748b" font-family="monospace" font-size="10">Status: 200 OK • Latency: 4ms</text>
    <text x="26" y="122" fill="#64748b" font-family="monospace" font-size="10">Memory: Local Edge AST</text>

    <!-- Mini JSON View -->
    <text x="26" y="146" fill="#10b981" font-family="monospace" font-size="9">{</text>
    <text x="36" y="160" fill="#10b981" font-family="monospace" font-size="9">"status": 200, "count": 3,</text>
    <text x="36" y="174" fill="#10b981" font-family="monospace" font-size="9">"data": [ { "id": "uuid-01", ... } ]</text>
    <text x="26" y="188" fill="#10b981" font-family="monospace" font-size="9">}</text>

    <rect x="26" y="196" width="208" height="16" rx="3" fill="#065f46" opacity="0.3"/>
    <text x="130" y="208" fill="#6ee7b7" font-family="monospace" font-size="9" text-anchor="middle">LIVE FILTER &amp; PAYLOAD SEARCH</text>
  </g>

  <!-- Flow Connector Compilers -> Export -->
  <path d="M 910 230 L 960 230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="960,226 968,230 960,234" fill="#f59e0b"/>

  <path d="M 910 500 L 960 500" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="960,496 968,500 960,504" fill="#10b981"/>

  <!-- ========================================================================= -->
  <!-- 5. LAYER: 1-CLICK EXPORT PIPELINE (Right) -->
  <!-- ========================================================================= -->
  <g transform="translate(970, 110)">
    <rect width="170" height="510" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect width="170" height="4" rx="2" fill="url(#accentCyan)"/>

    <text x="16" y="32" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 05</text>
    <text x="16" y="52" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">1-Click Export</text>
    <text x="16" y="72" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Production Bundles</text>

    <!-- Bundle Item 1 -->
    <rect x="14" y="95" width="142" height="70" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="24" y="118" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">schema.prisma</text>
    <text x="24" y="136" fill="#94a3b8" font-family="sans-serif" font-size="10">ORM Models &amp;</text>
    <text x="24" y="150" fill="#94a3b8" font-family="sans-serif" font-size="10">Relationships</text>

    <!-- Bundle Item 2 -->
    <rect x="14" y="175" width="142" height="70" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="24" y="198" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="700">init.sql</text>
    <text x="24" y="216" fill="#94a3b8" font-family="sans-serif" font-size="10">ANSI PostgreSQL</text>
    <text x="24" y="230" fill="#94a3b8" font-family="sans-serif" font-size="10">DDL &amp; Constraints</text>

    <!-- Bundle Item 3 -->
    <rect x="14" y="255" width="142" height="70" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="24" y="278" fill="#f1f5f9" font-family="monospace" font-size="12" font-weight="700">types.ts</text>
    <text x="24" y="296" fill="#94a3b8" font-family="sans-serif" font-size="10">Strict TypeScript</text>
    <text x="24" y="310" fill="#94a3b8" font-family="sans-serif" font-size="10">Interfaces</text>

    <!-- Bundle Item 4 -->
    <rect x="14" y="335" width="142" height="70" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="24" y="358" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">seed.json</text>
    <text x="24" y="376" fill="#94a3b8" font-family="sans-serif" font-size="10">Relational Mock</text>
    <text x="24" y="390" fill="#94a3b8" font-family="sans-serif" font-size="10">Seed Fixtures</text>

    <!-- Verified Badge -->
    <rect x="14" y="430" width="142" height="70" rx="6" fill="#0284c7" opacity="0.15" stroke="#0284c7" stroke-dasharray="3 3"/>
    <text x="85" y="458" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Ready for MVP</text>
    <text x="85" y="476" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Zero Configuration</text>
    <text x="85" y="490" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Devpost Certified</text>
  </g>

</svg>
